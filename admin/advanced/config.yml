# Login is GitHub, through Netlify's OAuth app (see ADMIN-SETUP.md).
# Git Gateway is not used. local_backend only turns on for localhost.
local_backend: true

backend:
  name: github
  repo: colinfenn/colinfenn-site
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  auth_scope: repo
  commit_messages:
    create: "Update {{collection}} on colinfenn.com"
    update: "Update {{collection}} on colinfenn.com"
    delete: "Update {{collection}} on colinfenn.com"
    uploadMedia: "Add file {{path}}"
    deleteMedia: "Remove file {{path}}"

publish_mode: simple
site_url: https://colinfenn.com
display_url: https://colinfenn.com
media_folder: media/videos
public_folder: /media/videos

collections:
  - name: videos
    label: Videos
    label_singular: Video
    description: Add a clip with a YouTube link or a short MP4. Long videos belong on YouTube.
    format: site-videos
    extension: json
    editor:
      preview: false
    files:
      - name: videos
        label: All videos
        file: data/videos.json
        description: Tap a video to edit it, or add one. Publish when you are done. Each upload must be under 50 MB.
        fields:
          - label: Videos
            name: videos
            widget: list
            label_singular: Video
            summary: "{{title}} — {{category}}"
            collapsed: true
            add_to_top: true
            hint: Use one or the other — a YouTube link, or an MP4 under 50 MB. If you fill in both, the uploaded file is the one that plays.
            fields:
              - label: Title
                name: title
                widget: string
                hint: "Short name, like Bullpen sinker or Friday highlights."
              - label: Category
                name: category
                widget: select
                default: Pitching
                options:
                  - Pitching
                  - Hitting
                  - Fielding
                  - "Training/Workouts"
                hint: This picks the tab on the site. Don't invent a new one.
              - label: YouTube link
                name: youtube
                widget: string
                required: false
                hint: "Paste the address of the video, like https://www.youtube.com/watch?v=… Leave blank if you are uploading a file instead."
              - label: Or upload an MP4
                name: file
                widget: file
                required: false
                choose_url: false
                media_folder: /media/videos
                public_folder: /media/videos
                hint: "MP4 only, under 50 MB. A full game is too big for the site and for a phone upload — put that on YouTube and paste the link. Wi-Fi is easier than cell data."
                media_library:
                  config:
                    max_file_size: 50000000
              - label: Thumbnail
                name: thumbnail
                widget: image
                required: false
                choose_url: true
                media_folder: /media/videos
                public_folder: /media/videos
                hint: "Poster image for an uploaded video. The phone uploader fills this in from a frame at about 1 second."
              - label: Tags
                name: tags
                widget: list
                required: false
                hint: "One tag per row. You can add more than one. Pitching: Sinker, Curveball, Slider, Cutter, Changeup, K, Pickoff, Game, Bullpen. Hitting: vs. Lefty, vs. Righty, Bunt, Single, Extra-base hit, Game, BP. Fielding: OF, Pitcher, Catch, Throw, Game, Practice. Training/Workouts: Bullpen, Weights, Speed/Agility."
                field:
                  label: Tag
                  name: tag
                  widget: string
              - label: Speed
                name: velo
                widget: string
                required: false
                hint: "Optional, and only for a pitching clip. Example: 75 mph. Shown on the card."
              - label: Feature this on the highlight reel
                name: featured
                widget: boolean
                default: false
                required: false
                hint: Only one clip should be on. It replaces the video at the top of the site.
              - label: Date
                name: date
                widget: string
                required: false
                hint: "Example: April 12, 2026. TBD is fine if you don't know yet."
              - label: Caption
                name: caption
                widget: text
                required: false
                hint: Shown under the video on the site.

  - name: stats
    label: Season stats
    description: Hitting and pitching numbers, one row per season.
    format: site-stats
    extension: json
    editor:
      preview: false
    files:
      - name: stats
        label: Season stats
        file: data/stats.json
        description: Type the numbers the way they should look on the site, like .408 or 41.0. Leave a box blank if you don't have that stat.
        fields:
          - label: Hitting rows are only an example
            name: hittingExample
            widget: boolean
            default: false
            hint: Leave this off for real stats. While it is on, the site marks the hitting table as an example.
          - label: Hitting note
            name: hittingNote
            widget: string
            required: false
            hint: Optional. Only shows when the example switch above is on.
          - label: Hitting seasons
            name: hittingRows
            widget: list
            label_singular: Season
            summary: "{{season}} · {{team}}"
            collapsed: true
            fields:
              - { label: Season, name: season, widget: string, hint: "Example: 2026" }
              - { label: Team, name: team, widget: string, hint: "Example: San Marin HS (Freshman)" }
              - { label: AVG, name: avg, widget: string, required: false, hint: "Batting average, example .408" }
              - { label: OBP, name: obp, widget: string, required: false, hint: "On-base percentage, example .491" }
              - { label: SLG, name: slg, widget: string, required: false, hint: "Slugging, example .551" }
              - { label: OPS, name: ops, widget: string, required: false, hint: "Example: 1.042" }
          - label: Pitching rows are only an example
            name: pitchingExample
            widget: boolean
            default: false
            hint: Leave this off for real stats.
          - label: Pitching note
            name: pitchingNote
            widget: string
            required: false
            hint: Optional. Only shows when the example switch above is on.
          - label: Pitching seasons
            name: pitchingRows
            widget: list
            label_singular: Season
            summary: "{{season}} · {{team}}"
            collapsed: true
            fields:
              - { label: Season, name: season, widget: string, hint: "Example: 2026" }
              - { label: Team, name: team, widget: string }
              - { label: IP, name: ip, widget: string, required: false, hint: "Innings pitched, example 41.0" }
              - { label: ERA, name: era, widget: string, required: false, hint: "Earned run average, example 5.29" }
              - { label: SO, name: so, widget: string, required: false, hint: "Strikeouts, example 42" }
              - { label: BB/IP, name: bbIp, widget: string, required: false, hint: "Walks per inning, example .585" }
              - { label: "Strike%", name: spct, widget: string, required: false, hint: "Strike percentage, example 55.64%" }
              - { label: "C%", name: cpct, widget: string, required: false, hint: "Contact percentage, example 89.80%" }

  - name: pitches
    label: Pitch velo
    description: Latest speed for each pitch, plus older readings.
    extension: json
    editor:
      preview: false
    files:
      - name: pitches
        label: Pitches
        file: data/pitches.json
        description: Each pitch keeps a history of readings. Add a new row when you measure again.
        fields:
          - label: Pitches
            name: pitches
            widget: list
            summary: "{{name}}"
            collapsed: true
            fields:
              - { label: Pitch, name: name, widget: string, hint: "Example: Sinker" }
              - label: Readings
                name: history
                widget: list
                label_singular: Reading
                summary: "{{mph}} mph · {{date}}"
                collapsed: true
                add_to_top: true
                hint: "Add a new reading to this list. New readings are appended and do not overwrite older ones, so the site can show the full history and a trend."
                fields:
                  - { label: MPH, name: mph, widget: number, value_type: int, min: 0, max: 120, step: 1, hint: "Example: 75" }
                  - { label: Month, name: date, widget: string, hint: "Year and month, like 2026-10." }

  - name: profile
    label: Profile and GPA
    description: Name, GPA, photo, honors, about video, and coaches.
    format: site-profile
    extension: json
    editor:
      preview: false
    files:
      - name: profile
        label: Profile
        file: data/profile.json
        description: GPA shows in the key numbers at the top. Type Placeholder in a box you don't know yet.
        fields:
          - { label: Name, name: name, widget: string }
          - label: Class year
            name: gradYear
            widget: number
            hint: "Example: 2029"
            value_type: int
            step: 1
          - { label: Position, name: position, widget: string, hint: "Example: LHP/OF" }
          - { label: Throws, name: throws, widget: string, hint: "L or R. Shown with bats as B/T." }
          - { label: Bats, name: bats, widget: string, required: false, hint: "L, R, or S. Shown with throws as B/T." }
          - { label: Height, name: height, widget: string, hint: "Example: 5'7\"" }
          - { label: Weight, name: weight, widget: string, required: false, hint: "Number only, example 140." }
          - { label: High school, name: school, widget: string }
          - { label: School city, name: schoolLocation, widget: string, hint: "Example: Novato, CA" }
          - { label: Travel team, name: travelTeam, widget: string }
          - { label: Email, name: email, widget: string }
          - label: Photo
            name: photo
            widget: image
            required: false
            choose_url: false
            media_folder: /img
            public_folder: /img
            hint: "A vertical photo works best, under about 5 MB. Leave this empty to keep the Photo coming soon box."
            media_library:
              config:
                max_file_size: 5000000
          - label: GPA
            name: academics
            widget: object
            hint: Shown in the key numbers at the top of the site.
            fields:
              - label: GPA
                name: gpa
                widget: string
                hint: "Example: 3.6. Type Placeholder if you don't have it yet."
          - label: About Me video
            name: about
            widget: object
            hint: Leave the link blank to show "About Me video coming soon."
            fields:
              - label: Video URL
                name: url
                widget: string
                required: false
                hint: "YouTube link or a path like /media/videos/about.mp4."
          - label: Highlight reel
            name: highlightReel
            widget: object
            hint: The big video near the top of the site. YouTube is best. An MP4 must be under 50 MB.
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - label: YouTube link
                name: youtube
                widget: string
                required: false
                hint: "Paste the video address. Leave blank if you upload a file instead."
              - label: Or upload an MP4
                name: file
                widget: file
                required: false
                choose_url: false
                media_folder: /media/videos
                public_folder: /media/videos
                hint: "Under 50 MB. For a longer reel, use YouTube."
                media_library:
                  config:
                    max_file_size: 50000000
              - { label: Caption, name: caption, widget: text, required: false, hint: "Shown under the reel." }
          - label: Honors
            name: honors
            widget: list
            summary: "{{title}}"
            collapsed: true
            fields:
              - { label: Title, name: title, widget: string, hint: "Example: Freshman Team MVP" }
              - { label: School or team, name: org, widget: string }
              - { label: Season, name: season, widget: string, required: false, hint: "Example: 2026" }
              - label: Show this in the gold banner
                name: featured
                widget: boolean
                default: false
                hint: Turn on for the honor that should show as the gold bar in Honors.
          - label: Coaches
            name: coaches
            widget: list
            summary: "{{role}}"
            collapsed: true
            fields:
              - { label: Role, name: role, widget: string, hint: "Example: High School Coach" }
              - { label: Name, name: name, widget: string }
              - { label: Team, name: team, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }
              - { label: Phone, name: phone, widget: string, required: false }
